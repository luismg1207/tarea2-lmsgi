    <nav>

        <a href="historia.html">Historia</a>

    </nav>

    <main>
        <h2>Formulario de Contacto</h2>
        <form action="#" method="get">
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto:</label>
                <select id="asunto" name="asunto">
                    <option value="info">Pedir Información</option>
                    <option value="sugerencia">Sugerencia</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferencia de contacto:</label>
                <input type="radio" name="pref" value="email" checked> Email
                <input type="radio" name="pref" value="tlf"> Teléfono
            </div>

            <div class="form-group">
                <input type="checkbox" name="acepto" id="acepto">
                <label for="acepto" style="display:inline">Acepto la política de privacidad</label>
            </div>

            <button type="submit">Enviar</button>
            <button type="reset">Borrar</button>
        </form>
    </main>
</body>
</html>
